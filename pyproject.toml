[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccprompt"
dynamic = ["version"]
description = "Extract code context for AI prompts based on a function or class name."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    { name = "Sam Arbid", email = "samarbid13@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.11.7",
]

[project.optional-dependencies]
javascript = ["esprima"]

[project.urls]
Homepage = "https://github.com/Samk13/ccprompt"
Repository = "https://github.com/Samk13/ccprompt"

[project.scripts]
ccprompt = "ccprompt.main:main"

[tool.setuptools.dynamic]
version = {attr = "ccprompt.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ccprompt*"]

[tool.hatch.version]
path = "ccprompt/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = "--verbose"

[tool.ruff.lint]
# see: https://docs.astral.sh/ruff/configuration/
# 1. Enable flake8-bugbear (`B`) rules, in addition to the defaults.
# E W: https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
# F: https://docs.astral.sh/ruff/rules/#pyflakes-f
# I : https://docs.astral.sh/ruff/rules/#isort-i
# PTH: https://docs.astral.sh/ruff/rules/#flake8-use-pathlib-pth
select = ["E4", "E7", "E9", "F","I"]
preview = true

# 2. Avoid enforcing line-length violations (`E501`)
ignore = ["E501"]

# 3. Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

# 4. Ignore `E402` (import violations) in all `__init__.py` files, and in selected subdirectories.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]

[tool.ruff.format]
# Use single quotes in `ruff format` (commented out for now)
# quote-style = "single"
